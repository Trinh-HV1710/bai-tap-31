<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài tập 31 - Tính tích các số chia hết cho 7</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 24px 32px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 360px;
    }
    h2 {
      margin-top: 0;
      color: #0d6efd;
      font-size: 20px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }
    input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #0d6efd;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0b5ed7;
    }
    .result {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      text-align: center;
      word-break: break-all;
    }
    .success {
      background-color: #d1e7dd;
      color: #0f5132;
      border: 1px solid #badbcc;
    }
    .error {
      background-color: #f8d7da;
      color: #842029;
      border: 1px solid #f5c2c7;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Tính tích số chia hết cho 7</h2>
    
    <form onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label for="startNum">Số đầu:</label>
        <input type="number" id="startNum" required placeholder="Nhập số bắt đầu">
      </div>
      <div class="form-group">
        <label for="endNum">Số cuối:</label>
        <input type="number" id="endNum" required placeholder="Nhập số kết thúc">
      </div>
      <button type="submit">Tính tích</button>
    </form>

    <div id="resultBox"></div>
  </div>

  <script>
    function handleSubmit(event) {
      event.preventDefault(); // Ngăn trang web reload khi gửi form

      // Lấy giá trị từ input
      const startNum = parseInt(document.getElementById("startNum").value, 10);
      const endNum = parseInt(document.getElementById("endNum").value, 10);
      const resultBox = document.getElementById("resultBox");

      // Kiểm tra hợp lệ: Số đầu không được lớn hơn số cuối
      if (startNum > endNum) {
        resultBox.className = "result error";
        resultBox.textContent = "Lỗi: Số đầu phải nhỏ hơn hoặc bằng số cuối!";
        return;
      }

      let product = 1;
      let count = 0; // Đếm số lượng số chia hết cho 7 tìm thấy

      // Duyệt qua khoảng từ startNum đến endNum
      for (let i = startNum; i <= endNum; i++) {
        if (i !== 0 && i % 7 === 0) { // Loại trừ 0 nếu có
          product *= i;
          count++;
        }
      }

      // Hiển thị kết quả
      resultBox.className = "result success";
      if (count === 0) {
        resultBox.textContent = `Không có số nào chia hết cho 7 trong khoảng [${startNum}, ${endNum}].`;
      } else {
        resultBox.textContent = `Tích các số chia hết cho 7 trong khoảng [${startNum}, ${endNum}] là: ${product}`;
        console.log("Tích tìm được:", product);
      }
    }
  </script>
</body>
</html>
